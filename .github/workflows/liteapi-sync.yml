# LiteAPI refresh of the shared Supabase hotels every 3 hours: updates changed hotels, hides deleted ones, adds a few new ones.
name: LiteAPI sync

on:
  schedule:
    # At :17 past every third hour (UTC), off the hour when scheduled runs pile up
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Hotels LiteAPI updated since: auto, 48h, 7d or an ISO timestamp like 2026-10-08T00:00:00Z'
        type: string
        default: auto
      dry_run:
        description: 'Dry run: fetch and report, write nothing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: liteapi-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check secrets
        env:
          LITEAPI_KEY: ${{ secrets.LITEAPI_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          missing=''
          for name in LITEAPI_KEY SUPABASE_SECRET_KEY NEXT_PUBLIC_SUPABASE_URL; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Not npm run import:liteapi: it reads .env.local, which isn't here
      - name: Sync hotels
        env:
          LITEAPI_KEY: ${{ secrets.LITEAPI_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # Inputs go through env, never straight into the script; a scheduled run has none
          SINCE: ${{ inputs.since || 'auto' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--since "$SINCE")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node scripts/import-liteapi.mts "${args[@]}"
